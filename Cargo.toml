[package]
name = "tablectl"
version = "0.1.0"
edition = "2024"
authors = ["Juan José de las Heras Herrera"]
description = "Universal CLI for inspecting, validating, converting and managing tabular data files"
license = "Apache-2.0"
repository = "https://github.com/datatools-hub/tablectl"
keywords = ["parquet", "arrow", "iceberg", "delta-lake", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
# Apache Arrow ecosystem (direct, without DataFusion)
arrow = { version = "55.2.0", features = ["chrono-tz"] }
arrow-array = "55.2.0"
arrow-schema = "55.2.0"
arrow-select = "55.2.0"
arrow-cast = "55.2.0"
arrow-csv = "55.2.0"
arrow-json = "55.2.0"
arrow-ipc = "55.2.0"
parquet = { version = "55.2.0", features = ["arrow", "async"] }

# Table formats
deltalake = { version = "0.28.0", default-features = false, features = ["rustls", "s3", "gcs", "azure"], optional = true }
iceberg = { version = "0.7", optional = true }
apache-avro = { version = "0.18", optional = true }

# Cloud storage abstraction
object_store = { version = "0.12.4", features = ["aws", "gcp", "azure", "http"] }

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"

# Output formatting
comfy-table = "7.1"
colored = "2.1"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Progress and UI
indicatif = "0.17"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Utilities
chrono = "0.4"
bytes = "1.7"
url = "2.5"
regex = "1.11"
log = "0.4"
env_logger = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
strip-ansi-escapes = "0.2"
num-traits = "0.2"

# Terminal UI (for tui command)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.13"
tokio-test = "0.4"

[features]
default = ["delta", "iceberg", "tui"]
delta = ["dep:deltalake", "deltalake/s3", "deltalake/gcs", "deltalake/azure"]
iceberg = ["dep:iceberg", "dep:apache-avro"]
tui = ["dep:ratatui", "dep:crossterm"]
all = ["delta", "iceberg", "tui"]

[[bin]]
name = "tablectl"
path = "src/main.rs"

[[bin]]
name = "build_fixtures"
path = "build_fixtures.rs"

[lib]
name = "tablectl"
path = "src/lib.rs"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
