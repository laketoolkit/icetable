[package]
name = "tabletools"
version = "0.1.0"
edition = "2024"
authors = ["TableTools Contributors"]
description = "Universal CLI for inspecting, validating, converting and managing tabular data files"
license = "Apache-2.0"
repository = "https://github.com/datatools-hub/tabletools"
keywords = ["parquet", "arrow", "iceberg", "delta-lake", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
# Apache Arrow ecosystem - use DataFusion's re-exported arrow
datafusion = { version = "49.0.2", features = ["parquet"] }

# Arrow CSV/JSON readers - must match DataFusion's arrow version (55.2.0)
arrow-csv = "55.2.0"
arrow-json = "55.2.0"

# Table formats
deltalake = { version = "0.28.0", features = ["s3", "gcs", "azure"], optional = true }
iceberg = { version = "0.7", optional = true }

# Cloud storage abstraction
object_store = { version = "0.12.4", features = ["aws", "gcp", "azure", "http"] }

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"

# Output formatting
comfy-table = "7.1"
colored = "2.1"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Progress and UI
indicatif = "0.17"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Utilities
chrono = "0.4"
bytes = "1.7"
url = "2.5"
regex = "1.11"
log = "0.4"
env_logger = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
strip-ansi-escapes = "0.2"

# Terminal UI (for tui command)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.13"
tokio-test = "0.4"

[features]
default = ["delta", "iceberg", "tui"]
delta = ["dep:deltalake"]
iceberg = ["dep:iceberg"]
tui = ["dep:ratatui", "dep:crossterm"]
all = ["delta", "iceberg", "tui"]

[[bin]]
name = "tabletools"
path = "src/main.rs"

[[bin]]
name = "build_fixtures"
path = "build_fixtures.rs"

[lib]
name = "tabletools"
path = "src/lib.rs"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
