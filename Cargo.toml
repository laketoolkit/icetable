[package]
name = "icetable"
version = "0.1.0"
edition = "2024"
authors = ["Juan José de las Heras Herrera"]
description = "CLI for managing Apache Iceberg tables - inspect, optimize, and more"
license = "Apache-2.0"
repository = "https://github.com/datatools-hub/icetable"
keywords = ["iceberg", "parquet", "arrow", "lakehouse", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
# Apache Arrow ecosystem (direct, without DataFusion)
arrow = { version = "55.2.0", features = ["chrono-tz"] }
arrow-array = "55.2.0"
arrow-schema = "55.2.0"
arrow-select = "55.2.0"
arrow-cast = "55.2.0"
arrow-csv = "55.2.0"
arrow-json = "55.2.0"
arrow-ipc = "55.2.0"
parquet = { version = "55.2.0", features = ["arrow", "async", "object_store"] }

# Table formats
deltalake = { version = "0.28.0", default-features = false, features = ["rustls", "s3", "gcs", "azure"] }
iceberg = { version = "0.7" }
iceberg-catalog-rest = { version = "0.7", optional = true }

# Cloud storage abstraction
object_store = { version = "0.12.4", features = ["aws", "gcp", "azure", "http"] }

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"

# Output formatting
comfy-table = { version = "7.1", features = ["custom_styling"] }
colored = "2.1"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Progress and UI
indicatif = "0.18"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
async-channel = "2.3"

# Utilities
chrono = "0.4"
bytes = "1.7"
url = "2.5"
regex = "1.11"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
strip-ansi-escapes = "0.2"
num-traits = "0.2"
tempfile = "3.13"
parking_lot = "0.12"
rand = "0.8"

# Terminal UI (for tui command)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
reqwest = { version = "0.12.24", features = ["json"] }
rayon = "1.11.0"
tokio-stream = "0.1.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
insta = { version = "1.40", features = ["yaml"] }
tokio-test = "0.4"
uuid = { version = "1.0", features = ["v4"] }
serial_test = "3.2"

[features]
default = ["rest-catalog"]
tui = ["dep:ratatui", "dep:crossterm"]
# REST catalog support for Nessie, Polaris, Tabular, etc.
rest-catalog = ["dep:iceberg-catalog-rest"]
all = ["tui", "rest-catalog"]

[[bin]]
name = "icetable"
path = "src/main.rs"

[lib]
name = "icetable"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
