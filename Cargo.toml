[package]
name = "tabletools"
version = "0.1.0"
edition = "2024"
authors = ["TableTools Contributors"]
description = "Universal CLI for inspecting, validating, converting and managing tabular data files"
license = "Apache-2.0"
repository = "https://github.com/datatools-hub/tabletools"
keywords = ["parquet", "arrow", "iceberg", "delta-lake", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
# Apache Arrow ecosystem - core data processing
arrow = { version = "54", features = ["prettyprint"] }
arrow-array = "54"
arrow-csv = "54"
arrow-json = "54"
arrow-schema = "54"
arrow-ipc = "54"
arrow-row = "54"
parquet = { version = "54", features = ["async"] }
datafusion = { version = "44", features = ["parquet"] }

# Table formats
deltalake = { version = "0.22", features = ["s3", "gcs", "azure"], optional = true }
iceberg = { version = "0.3", optional = true }

# Cloud storage abstraction
object_store = { version = "0.11", features = ["aws", "gcp", "azure", "http"] }

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"

# Output formatting
comfy-table = "7.1"
colored = "2.1"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Progress and UI
indicatif = "0.17"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# Utilities
chrono = "0.4"
bytes = "1.7"
url = "2.5"
regex = "1.11"
log = "0.4"
env_logger = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
strip-ansi-escapes = "0.2"

# Terminal UI (for tui command)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.13"
tokio-test = "0.4"

[features]
default = ["delta", "tui"]
delta = ["dep:deltalake"]
iceberg = ["dep:iceberg"]
tui = ["dep:ratatui", "dep:crossterm"]
all = ["delta", "iceberg", "tui"]

[[bin]]
name = "tabletools"
path = "src/main.rs"

[[bin]]
name = "build_fixtures"
path = "build_fixtures.rs"

[lib]
name = "tabletools"
path = "src/lib.rs"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
