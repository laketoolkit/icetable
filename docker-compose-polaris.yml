services:
  minio:
    image: minio/minio:latest
    network_mode: host
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    network_mode: host
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://localhost:9000 minioadmin minioadmin;
      mc mb myminio/iceberg-warehouse --ignore-existing;
      exit 0;
      "

  # Apache Polaris - Iceberg REST Catalog
  polaris:
    image: apache/polaris:latest
    platform: linux/amd64
    network_mode: host
    environment:
      # AWS/S3 credentials for MinIO access
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # Bootstrap credentials: realm,username,password
      POLARIS_BOOTSTRAP_CREDENTIALS: default,admin,admin
      # Polaris configuration
      polaris.realm-context.realms: default
      polaris.features.DROP_WITH_PURGE_ENABLED: "true"
      # S3 FileIO configuration for MinIO
      polaris.catalog.io.s3.endpoint: http://localhost:9000
      polaris.catalog.io.s3.path-style-access: "true"
      polaris.catalog.io.s3.access-key-id: minioadmin
      polaris.catalog.io.s3.secret-access-key: minioadmin
      # Java AWS SDK properties
      JAVA_OPTS: >-
        -Daws.accessKeyId=minioadmin
        -Daws.secretAccessKey=minioadmin
        -Daws.region=us-east-1
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Setup Polaris with warehouse configured for MinIO
  polaris-setup:
    image: curlimages/curl:latest
    network_mode: host
    depends_on:
      polaris:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Getting OAuth token...';
      TOKEN=$$(curl -s -X POST http://localhost:8181/api/catalog/v1/oauth/tokens \
        -d 'grant_type=client_credentials&client_id=admin&client_secret=admin&scope=PRINCIPAL_ROLE:ALL' \
        | sed -n 's/.*\"access_token\":\"\([^\"]*\)\".*/\1/p');
      echo \"Token: $${TOKEN:0:20}...\";

      echo 'Creating warehouse dev...';
      curl -s -X POST http://localhost:8181/api/management/v1/catalogs \
        -H \"Authorization: Bearer $$TOKEN\" \
        -H 'Content-Type: application/json' \
        -d '{
          \"catalog\": {
            \"name\": \"dev\",
            \"type\": \"INTERNAL\",
            \"properties\": {
              \"default-base-location\": \"s3://iceberg-warehouse/dev\"
            },
            \"storageConfigInfo\": {
              \"storageType\": \"S3\",
              \"allowedLocations\": [\"s3://iceberg-warehouse/dev\"],
              \"s3.endpoint\": \"http://localhost:9000\",
              \"s3.path-style-access\": \"true\",
              \"s3.access-key-id\": \"minioadmin\",
              \"s3.secret-access-key\": \"minioadmin\"
            }
          }
        }' || true;

      echo 'Creating catalog role...';
      curl -s -X POST http://localhost:8181/api/management/v1/catalogs/dev/catalog-roles \
        -H \"Authorization: Bearer $$TOKEN\" \
        -H 'Content-Type: application/json' \
        -d '{\"catalogRole\": {\"name\": \"admin_role\"}}' || true;

      echo 'Granting catalog privileges...';
      curl -s -X PUT http://localhost:8181/api/management/v1/catalogs/dev/catalog-roles/admin_role/grants \
        -H \"Authorization: Bearer $$TOKEN\" \
        -H 'Content-Type: application/json' \
        -d '{\"grant\": {\"type\": \"catalog\", \"privilege\": \"CATALOG_MANAGE_CONTENT\"}}' || true;

      echo 'Assigning role to admin...';
      curl -s -X PUT http://localhost:8181/api/management/v1/principal-roles/admin/catalog-roles/dev \
        -H \"Authorization: Bearer $$TOKEN\" \
        -H 'Content-Type: application/json' \
        -d '{\"catalogRole\": {\"name\": \"admin_role\"}}' || true;

      echo 'Setup complete!';
      "
