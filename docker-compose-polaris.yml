services:
  minio:
    image: minio/minio:latest
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/iceberg-warehouse --ignore-existing;
      exit 0;
      "

  # Apache Polaris - Iceberg REST Catalog
  polaris:
    image: apache/polaris:latest
    platform: linux/amd64
    hostname: polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      # AWS/S3 credentials for MinIO access
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # Bootstrap credentials: realm,username,password
      POLARIS_BOOTSTRAP_CREDENTIALS: default,admin,admin
      # Polaris configuration
      polaris.realm-context.realms: default
      polaris.features.DROP_WITH_PURGE_ENABLED: "true"
      # Disable credential vending - client provides own credentials
      polaris.features.VENDING_DISABLED: "true"
      # S3 FileIO configuration for MinIO
      polaris.catalog.io.s3.endpoint: http://minio:9000
      polaris.catalog.io.s3.path-style-access: "true"
      polaris.catalog.io.s3.access-key-id: minioadmin
      polaris.catalog.io.s3.secret-access-key: minioadmin
      # Java AWS SDK properties
      JAVA_OPTS: >-
        -Daws.accessKeyId=minioadmin
        -Daws.secretAccessKey=minioadmin
        -Daws.region=us-east-1
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: icetable_default
