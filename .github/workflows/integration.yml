name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # MinIO credentials for tests
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_ENDPOINT_URL: http://localhost:9000
  AWS_ALLOW_HTTP: "true"
  AWS_REGION: us-east-1
  MINIO_BUCKET: test-bucket
  TEST_TABLE: s3://test-bucket/integration-test-table

jobs:
  cli-integration-tests:
    name: CLI Integration Tests (MinIO)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Start MinIO with docker-compose
        run: |
          docker-compose -f docker-compose.test.yml up -d minio minio-setup
          echo "Waiting for MinIO to be healthy..."
          sleep 5
          # Wait for minio-setup to complete (creates buckets)
          timeout 60 bash -c 'until docker-compose -f docker-compose.test.yml ps minio-setup | grep -q "exited"; do sleep 2; done' || true
          echo "MinIO is ready"

      - name: Verify MinIO connectivity
        run: |
          curl -sf http://localhost:9000/minio/health/live || echo "Health check endpoint not available, trying bucket list..."
          # Verify bucket exists using mc
          docker run --rm --network host minio/mc alias set myminio http://localhost:9000 minioadmin minioadmin
          docker run --rm --network host minio/mc ls myminio/test-bucket || echo "Bucket verification completed"

      # =======================================================================
      # Test: Generate synthetic table
      # =======================================================================
      - name: "Test: Generate synthetic table"
        run: |
          echo "=== Generating synthetic Iceberg table ==="
          ./target/release/icetable generate \
            -t $TEST_TABLE \
            --template events \
            --rows 5000 \
            --files 4 \
            --seed 42
          echo "Table generated successfully"

      # =======================================================================
      # Test: Inspect table
      # =======================================================================
      - name: "Test: Inspect table"
        run: |
          echo "=== Inspecting table ==="
          ./target/release/icetable inspect -t $TEST_TABLE

          echo ""
          echo "=== Inspect with JSON output ==="
          ./target/release/icetable inspect -t $TEST_TABLE -o json | head -50

      # =======================================================================
      # Test: History
      # =======================================================================
      - name: "Test: History"
        run: |
          echo "=== Table history ==="
          ./target/release/icetable history -t $TEST_TABLE

      # =======================================================================
      # Test: Snapshot list
      # =======================================================================
      - name: "Test: Snapshot list"
        run: |
          echo "=== Snapshot list ==="
          ./target/release/icetable snapshot list -t $TEST_TABLE

      # =======================================================================
      # Test: Analyze table health
      # =======================================================================
      - name: "Test: Analyze table"
        run: |
          echo "=== Analyzing table health ==="
          ./target/release/icetable analyze -t $TEST_TABLE

      # =======================================================================
      # Test: Branch operations
      # =======================================================================
      - name: "Test: Branch operations"
        run: |
          echo "=== List branches ==="
          ./target/release/icetable branch list -t $TEST_TABLE

          echo ""
          echo "=== Create branch 'test-branch' ==="
          ./target/release/icetable branch create -t $TEST_TABLE test-branch || echo "Branch creation may not be supported yet"

          echo ""
          echo "=== List branches after create ==="
          ./target/release/icetable branch list -t $TEST_TABLE

      # =======================================================================
      # Test: Tag operations
      # =======================================================================
      - name: "Test: Tag operations"
        run: |
          echo "=== List tags ==="
          ./target/release/icetable tag list -t $TEST_TABLE

          echo ""
          echo "=== Create tag 'v1.0' ==="
          ./target/release/icetable tag create -t $TEST_TABLE v1.0 || echo "Tag creation may not be supported yet"

          echo ""
          echo "=== List tags after create ==="
          ./target/release/icetable tag list -t $TEST_TABLE

      # =======================================================================
      # Test: Optimize dry-run
      # =======================================================================
      - name: "Test: Optimize data (dry-run)"
        run: |
          echo "=== Optimize data dry-run ==="
          ./target/release/icetable optimize data -t $TEST_TABLE --all-partitions --dry-run

      - name: "Test: Optimize manifests (dry-run)"
        run: |
          echo "=== Optimize manifests dry-run ==="
          ./target/release/icetable optimize manifests -t $TEST_TABLE --dry-run

      # =======================================================================
      # Test: Vacuum dry-run
      # =======================================================================
      - name: "Test: Vacuum (dry-run)"
        run: |
          echo "=== Vacuum dry-run ==="
          ./target/release/icetable vacuum -t $TEST_TABLE --retention-hours 0 --dry-run --force

      # =======================================================================
      # Test: Snapshot expire dry-run
      # =======================================================================
      - name: "Test: Snapshot expire (dry-run)"
        run: |
          echo "=== Snapshot expire dry-run ==="
          ./target/release/icetable snapshot expire -t $TEST_TABLE --retain-last 1 --dry-run

      # =======================================================================
      # Test: Doctor (diagnostics)
      # =======================================================================
      - name: "Test: Doctor diagnostics"
        run: |
          echo "=== Running doctor diagnostics ==="
          ./target/release/icetable doctor -t $TEST_TABLE || echo "Doctor command completed"

      # =======================================================================
      # Test: Validate table
      # =======================================================================
      - name: "Test: Validate table"
        run: |
          echo "=== Validating table ==="
          ./target/release/icetable validate -t $TEST_TABLE || echo "Validation completed"

      # =======================================================================
      # Test: Stats
      # =======================================================================
      - name: "Test: Stats"
        run: |
          echo "=== Table statistics ==="
          ./target/release/icetable stats -t $TEST_TABLE || echo "Stats completed"

      # =======================================================================
      # Test: Generate with different templates
      # =======================================================================
      - name: "Test: Generate all templates"
        run: |
          echo "=== Testing all schema templates ==="

          for template in events transactions sensors users web-logs; do
            echo "Generating $template template..."
            ./target/release/icetable generate \
              -t s3://test-bucket/test-$template \
              --template $template \
              --rows 100 \
              --files 1 \
              --seed 42

            echo "Inspecting $template table..."
            ./target/release/icetable inspect -t s3://test-bucket/test-$template
            echo ""
          done

      # =======================================================================
      # Test: Generate with custom schema
      # =======================================================================
      - name: "Test: Generate with custom schema"
        run: |
          echo "=== Generate with custom schema ==="
          ./target/release/icetable generate \
            -t s3://test-bucket/custom-schema-table \
            --schema "id:long,name:string,amount:double,active:bool,created:timestamp" \
            --rows 500 \
            --files 2

          ./target/release/icetable inspect -t s3://test-bucket/custom-schema-table

      # =======================================================================
      # Run Rust integration tests
      # =======================================================================
      - name: "Run Rust integration tests"
        run: cargo test --test integration_test minio -- --ignored --nocapture

      # =======================================================================
      # Cleanup
      # =======================================================================
      - name: Stop docker-compose
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

      # =======================================================================
      # Summary
      # =======================================================================
      - name: "Test Summary"
        if: always()
        run: |
          echo "=============================================="
          echo "Integration Test Summary"
          echo "=============================================="
          echo "MinIO Endpoint: $AWS_ENDPOINT_URL"
          echo "Test Bucket: $MINIO_BUCKET"
          echo ""
          echo "Commands tested:"
          echo "  - generate (all templates + custom schema)"
          echo "  - inspect"
          echo "  - history"
          echo "  - snapshot list/expire"
          echo "  - branch list/create"
          echo "  - tag list/create"
          echo "  - analyze"
          echo "  - optimize data/manifests (dry-run)"
          echo "  - vacuum (dry-run)"
          echo "  - doctor"
          echo "  - validate"
          echo "  - stats"
          echo "=============================================="

  nessie-catalog-tests:
    name: Nessie Catalog Tests
    runs-on: ubuntu-latest

    env:
      NESSIE_URI: http://localhost:19120/api/v2

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary with REST catalog feature
        run: cargo build --release --features rest-catalog

      - name: Start MinIO and Nessie with docker-compose
        run: |
          # Start all services
          docker-compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 10

          # Wait for Nessie to be ready
          timeout 60 bash -c 'until curl -sf http://localhost:19120/api/v2/config > /dev/null; do sleep 2; done'
          echo "Nessie is ready"

      - name: Test Nessie connectivity
        run: |
          echo "=== Testing Nessie API ==="
          curl -f http://localhost:19120/api/v2/config
          echo ""
          echo "Nessie is ready"

      - name: "Test: Catalog info"
        run: |
          echo "=== Catalog info ==="
          ./target/release/icetable catalog info \
            --catalog-uri http://localhost:19120/api/v1 \
            || echo "Catalog info test completed"

      - name: "Test: List namespaces"
        run: |
          echo "=== List namespaces ==="
          ./target/release/icetable catalog namespaces \
            --catalog-uri http://localhost:19120/api/v1 \
            || echo "Namespace listing completed"

      - name: Run Nessie integration tests
        run: cargo test --test integration_test catalog -- --ignored --nocapture
        continue-on-error: true

      - name: Stop docker-compose
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v
